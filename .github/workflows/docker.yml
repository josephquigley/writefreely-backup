name: Test and publish

# One package per database variant, rather than one package with the variant
# in the tag. The two are peers with no defensible default, so a single
# package would have no meaningful `latest`, and every version pin would be a
# compound like 1.4-sqlite that reads as "version 1.4 of sqlite" rather than
# of this tool. Separate names give each variant a clean tag namespace:
# latest, main, sha-xxxxxxx, and semver once there is a release to cut.
#
# Pushing a v* tag publishes the matching semver tags. Until then there are
# no version tags at all, which is deliberate: nothing external depends on
# this yet, and an unused version scheme is just something to maintain.
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install restic, sqlite3 and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends restic sqlite3 shellcheck

      # The shell gets the same gate a compiled language gets from its
      # formatter: nothing merges that shellcheck rejects.
      - name: shellcheck
        run: shellcheck -x entrypoint.sh scripts/*.sh drivers/*.sh test/*.sh

      - name: Unit tests
        run: bash test/run.sh

      # Prove the image a deployment actually runs can back up and restore,
      # not only the scripts in the checkout.
      - name: Build the SQLite image
        run: docker build -f Dockerfile.sqlite -t wf-backup:sqlite .

      - name: SQLite round-trip through the image
        run: bash test/roundtrip-sqlite.sh

  test-mysql:
    name: test (MariaDB)
    # Pulls a MariaDB server and boots it, so it is slower than the rest.
    # Split out so a slow pull does not hold up fast feedback.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the MySQL image
        run: docker build -f Dockerfile.mysql -t wf-backup:mysql .

      - name: MariaDB round-trip against a real server
        run: bash test/roundtrip-mysql.sh

  publish:
    name: publish (${{ matrix.variant }})
    needs: [test, test-mysql]
    # Nothing is published from a pull request: the tests above still run
    # there, so a proposed change is checked without touching the registry.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [sqlite, mysql]
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      # Required before the build: cache export is unsupported on the
      # default docker driver.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log into ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.variant }}
          # semver entries fire only on a v* tag push, so they produce
          # nothing until there is a release. An operator can then pin as
          # loosely or as tightly as they like: :1, :1.4, or :1.4.2.
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
          # latest is handled by the raw entry above rather than by the
          # flavor, because `latest=auto` only fires on a semver tag match
          # and there are no releases yet, which would leave each package
          # with no latest at all.
          flavor: latest=false

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # arm64 is built under emulation, so a cold cache is slow.
          cache-from: type=gha
          cache-to: type=gha,mode=max

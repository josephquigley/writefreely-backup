name: Test and publish

# Tags are branch and short sha only. There is no semver for this image:
# deployments pin by digest, which makes an upgrade a deliberate edit rather
# than a tag moving underneath a running container.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install restic, sqlite3 and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends restic sqlite3 shellcheck

      # The shell gets the same gate a compiled language gets from its
      # formatter: nothing merges that shellcheck rejects.
      - name: shellcheck
        run: shellcheck -x entrypoint.sh scripts/*.sh drivers/*.sh test/*.sh

      - name: Unit tests
        run: bash test/run.sh

      # Prove the image a deployment actually runs can back up and restore,
      # not only the scripts in the checkout.
      - name: Build the SQLite image
        run: docker build -f Dockerfile.sqlite -t wf-backup:sqlite .

      - name: SQLite round-trip through the image
        run: bash test/roundtrip-sqlite.sh

  test-mysql:
    name: test (MariaDB)
    # Pulls a MariaDB server and boots it, so it is slower than the rest.
    # Split out so a slow pull does not hold up fast feedback.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the MySQL image
        run: docker build -f Dockerfile.mysql -t wf-backup:mysql .

      - name: MariaDB round-trip against a real server
        run: bash test/roundtrip-mysql.sh

  publish:
    name: publish (${{ matrix.variant }})
    needs: [test, test-mysql]
    # Nothing is published from a pull request: the tests above still run
    # there, so a proposed change is checked without touching the registry.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [sqlite, mysql]
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      # Required before the build: cache export is unsupported on the
      # default docker driver.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log into ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.variant }}
            type=sha,format=short,suffix=-${{ matrix.variant }}
          # There is no release tag for this image, so there is no latest.
          flavor: latest=false

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # arm64 is built under emulation, so a cold cache is slow.
          cache-from: type=gha
          cache-to: type=gha,mode=max
